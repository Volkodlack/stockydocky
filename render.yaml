# Configuration de déploiement Render pour Carles Inventaire
# Doc : https://render.com/docs/blueprint-spec
#
# 1 service web Node (sert l'API REST + le frontend React buildé)
# La base de données PostgreSQL est hébergée GRATUITEMENT sur Neon (neon.tech),
# et non sur Render (dont la base gratuite expire au bout de 30 jours).
#
# AVANT le déploiement :
#   1. Crée un projet PostgreSQL gratuit sur https://neon.tech
#   2. Copie la chaîne de connexion DIRECTE (voir README)
#   3. Sur Render, renseigne la variable DATABASE_URL avec cette chaîne
#
# Déploiement : connecter le dépôt Git à Render -> "New Blueprint".

services:
  - type: web
    name: carles-inventaire
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Chaîne de connexion PostgreSQL (Neon). À COLLER dans le tableau de bord
      # Render (Environment) — elle n'est pas versionnée pour rester secrète.
      # Format : postgresql://user:password@ep-xxx.eu-central-1.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Identifiants du compte administrateur créé au premier déploiement (seed).
      # À MODIFIER après la première connexion.
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        value: Admin123!
      # Identité émettrice des bons de livraison (PDF). Personnalisez ces valeurs.
      - key: COMPANY_NAME
        value: SAS Carles
      - key: PDF_VAT_RATE
        value: "20"
